<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Udaan — Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/styles.css">
  </head>
  <body>
    <nav class="navbar navbar-dark bg-dark mb-4">
      <div class="container-fluid">
        <a class="navbar-brand" href="/">Udaan Admin</a>
        <div>
          <button id="logoutBtn" class="btn btn-sm btn-outline-light">Logout</button>
        </div>
      </div>
    </nav>
    <main class="container">
      <div id="loginCard" class="card mx-auto" style="max-width:480px">
        <div class="card-body">
          <h5 class="card-title">Admin Login</h5>
          <form id="loginForm">
            <div class="mb-3">
              <label class="form-label">Username</label>
              <input name="username" class="form-control" required>
            </div>
            <div class="mb-3">
              <label class="form-label">Password</label>
              <input name="password" type="password" class="form-control" required>
            </div>
            <button class="btn btn-primary">Login</button>
            <div id="loginMsg" class="mt-3"></div>
          </form>
        </div>
      </div>

      <div id="dashboard" class="d-none">
        <h3>Reports</h3>
        <div class="table-responsive">
          <table class="table table-striped" id="reportsTable">
            <thead>
              <tr><th>#</th><th>Image</th><th>Details</th><th>Geo</th><th>When</th><th>Actions</th></tr>
            </thead>
            <tbody></tbody>
          </table>
        </div>
      </div>
    </main>

    <script src="/js/admin.js"></script>
  </body>
</html>
