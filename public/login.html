<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Udaan — Admin Login</title>
    <link rel="icon" type="image/png" href="/Logo.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/styles-login.css">
  </head>
  <body>
    <nav class="navbar modern-navbar">
      <div class="container nav-flex">
        <div class="nav-brand-group">
          <img src="/Logo.png" alt="Udaan Logo" class="navbar-logo">
          <a class="navbar-brand" href="/">Udaan Admin</a>
          <span id="headerSubtitle">Reporting Dashboard</span>
        </div>
        <div class="nav-actions"></div>
      </div>
    </nav>
    <main class="login-main">
      <div id="loginCard" class="login-card">
        <div class="card-body">
          <h2 class="page-title">Admin Login</h2>
          <form id="loginForm" style="margin-top:12px;">
            <div class="mb-3">
              <label class="form-label fw-bold">Username</label>
              <input name="username" class="form-control" placeholder="username" required>
            </div>
            <div class="mb-3">
              <label class="form-label fw-bold">Password</label>
              <input name="password" type="password" class="form-control" placeholder="password" required>
            </div>
            <div style="display:flex;gap:8px;align-items:center">
              <button class="btn btn-primary">Login</button>
              <div id="loginMsg" class="mt-3"></div>
            </div>
          </form>
        </div>
      </div>
    </main>
    <script src="/js/login.js"></script>
  </body>
</html>
