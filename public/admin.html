<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Udaan — Admin</title>
    <link rel="icon" type="image/png" href="/Logo.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/styles-admin.css">
  </head>
  <body>
    <nav class="navbar modern-navbar">
      <div class="container nav-flex">
        <div class="nav-brand-group">
          <img src="/Logo.png" alt="Udaan Logo" class="navbar-logo">
          <a class="navbar-brand">Udaan Admin</a>
          <span id="headerSubtitle">Reporting Dashboard</span>
        </div>
        <div class="nav-actions">
          <div id="adminGreeting">Welcome <span id="adminName">Admin</span></div>
          <button id="logoutBtn" class="btn btn-outline-primary btn-sm">Logout</button>
        </div>
      </div>
    </nav>

    <!-- Hero Banner -->
    <section class="hero-banner">
      <img src="/Udaan_pic.jpg" alt="Udaan Hero" class="hero-bg-img">
      <div class="hero-content">
        <h1>Udaan - Real-Time Incident Reporting</h1>
        <p class="hero-sub">Report and manage incidents with precision and ease</p>
      </div>
    </section>


    <main class="container dashboard-main">
      <section id="dashboard" class="dashboard-card">
        <div class="page-header">
          <div>
            <h3 class="page-title">Reports</h3>
            <div class="small-muted">Manage and verify incoming reports</div>
          </div>
          <div class="toolbar">
            <label class="fw-bold">Filter by Severity:</label>
            <select id="severityFilter" class="form-select form-select-sm">
              <option value="">All</option>
              <option value="high">High</option>
              <option value="moderate">Moderate</option>
              <option value="low">Low</option>
            </select>
            <button id="bulkVerify" class="btn btn-success btn-sm">Verify Selected</button>
            <button id="bulkDelete" class="btn btn-outline-primary btn-sm">Delete Selected</button>
          </div>
        </div>
        <div class="table-responsive">
          <table class="table table-striped" id="reportsTable">
            <thead>
              <tr><th style="width:40px;">Select</th><th style="width:40px;">Sr.No.</th><th style="width:140px;">Image</th><th>Details</th><th style="width:220px;">Geolocation</th><th style="width:180px;">When</th><th style="width:140px;">Actions</th></tr>
            </thead>
            <tbody></tbody>
          </table>
        </div>
      </section>
    </main>

    <!-- Geocoding removed; only admin script loaded -->
    <script src="/js/admin.js"></script>
  </body>
</html>
